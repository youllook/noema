<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<title>Noema / 認知核心</title>
<style>
* { box-sizing: border-box; }
:root { color-scheme: dark; font-family: "Segoe UI", "Microsoft JhengHei UI", "Microsoft JhengHei", sans-serif; }
html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
body { color: var(--text); --mono: Consolas, "Cascadia Mono", ui-monospace, monospace;
  --surface:#060b10; --panel:#10202bb0; --text:#e2f1f6; --muted:#7f98a3; --line:#8fdcf52a; --accent:#8fdcf5; --write:#ff895b;
  --project:#8fdcf5; --feedback:#86ecc4; --user:#c9b6f6; --reference:#f2c98a; }
button, select { font: inherit; }
button { color: inherit; cursor: pointer; }
button:focus-visible, select:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
.window { width: 100vw; height: 100vh; position: relative; isolation: isolate; overflow: hidden; display: grid;
  grid-template-rows: 46px 80px minmax(150px, 1fr) 122px 28px;
  border: 1px solid #4f9fbd60; border-radius: 8px; background: linear-gradient(135deg,#0f2230aa,transparent 45%),#060b10; }
.window:after { content:''; position:absolute; inset:0; pointer-events:none; z-index:8; opacity:.16; background:repeating-linear-gradient(0deg,transparent 0 3px,#9bd3e012 3px 4px); }
.topbar { margin: 0 21px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px dashed var(--line); cursor: default; }
.brand { display: flex; align-items: center; gap: 9px; font-size: 11px; letter-spacing: 2.8px; font-weight: 650; }
.brand-mark { flex: none; width: 15px; height: 15px; border: 1px solid var(--accent); border-radius: 1px; position: relative; transform: rotate(45deg); }
.brand-mark:after { content: ''; position: absolute; inset: 4px; background: var(--accent); box-shadow: 0 0 12px var(--accent); animation: idle 3.2s ease-in-out infinite; }
.brand-mark.live:after { animation: live .7s ease-in-out infinite; }
.brand-mark.live:after { background: var(--ev, var(--accent)); box-shadow: 0 0 14px var(--ev, var(--accent)); }
@keyframes idle { 50% { opacity: .45; box-shadow: 0 0 3px var(--accent); } }
@keyframes live { 50% { transform: scale(1.9); opacity: .55; } }
.window-controls { display: flex; gap: 6px; }
.icon-btn { border: 1px solid var(--line); border-radius: 0; width: 25px; height: 24px; background: transparent; color: var(--muted); line-height: 1; padding: 0; font-size: 12px; }
.icon-btn:hover { color: var(--text); border-color: var(--accent); }
.icon-btn[aria-pressed="true"] { color: var(--accent); border-color: #8fdcf588; }
.hero { padding: 11px 22px 8px; position: relative; }
.eyebrow { display: flex; align-items: center; gap: 6px; font: 9px var(--mono); letter-spacing: 2.2px; color: var(--muted); }
.eyebrow select { max-width: 200px; background: #08131ae8; color: var(--accent); border: 1px solid var(--line); border-radius: 0; padding: 2px 4px; font: 9px var(--mono); letter-spacing: .4px; }
h1 { margin: 3px 0 0; font-size: 29px; font-weight: 650; letter-spacing: 6px; }
.hero-count { position: absolute; right: 23px; top: 20px; text-align: right; pointer-events: none; }
.hero-count .archive-toggle { pointer-events: auto; margin: 7px 0 0 auto; display: block; }   /* 封存數量＝顯示／隱藏封存的切換鈕（2026-11-13 合併） */
.hero-count strong { font: 26px var(--mono); font-weight: 300; color: var(--accent); }
.hero-count span { display: block; margin-top: 3px; color: var(--muted); font-size: 9px; letter-spacing: 1px; }
.section-label { display: flex; align-items: center; justify-content: space-between; color: var(--muted); font: 9px var(--mono); letter-spacing: 1.5px; }
.section-label em { font-style: normal; font-size: 9px; letter-spacing: .3px; }
/* 啟動注入＝中央神經元下方的兩個圓形儀表（2026-11-12 用戶定，取代門把）：左 CLAUDE.md、右 MEMORY.md
   不接進網路，被讀寫時自己發光；弧＝占預算比例，紅刻度＝這個檔再長到哪裡合計就超標；位置由 resize() 算 */
.handle { --hc: var(--accent); --gr: 40px; position: absolute; z-index: 120; padding: 0; border: 0; border-radius: 50%; background: none; transform: translate(-50%, -50%); color: var(--hc); transition: filter .3s; }
.handle svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.handle .g-disc { fill: #050b10cc; stroke: #8fdcf522; }
.handle .g-ticks line { stroke: var(--hc); }
.handle .g-track { fill: none; stroke: #ffffff12; stroke-width: 5; }
.handle .g-arc { fill: none; stroke: var(--hc); stroke-width: 5; stroke-linecap: round; transition: stroke-dasharray .6s ease, stroke .3s; }
.handle .g-bud { stroke: #ff4856; stroke-width: 2; }
.handle .g-flash { fill: none; stroke: var(--hc); stroke-width: 2; opacity: 0; }
.handle .g-num { position: absolute; left: 0; right: 0; top: 30%; text-align: center; font-size: calc(var(--gr) * .42); font-weight: 300; line-height: 1; color: #eaf7fb; pointer-events: none; }
.handle .g-lab { position: absolute; left: 0; right: 0; top: 60%; text-align: center; font: max(7px, calc(var(--gr) * .16)) var(--mono); letter-spacing: .3px; color: var(--hc); pointer-events: none; }
.handle:hover, .handle:focus-visible { filter: brightness(1.3); outline: none; }
.handle.over { --hc: #ff4856; }
.handle.over .g-arc { animation: g-over 1.1s ease-in-out infinite; }
@keyframes g-over { 50% { opacity: .45; } }
.handle.reading, .handle.writing { --hc: var(--ev); filter: drop-shadow(0 0 10px var(--ev)); }
.handle.reading .g-flash, .handle.writing .g-flash { animation: g-flash 1.1s ease-out infinite; }
@keyframes g-flash { 0% { opacity: 1; stroke-width: 7; } 100% { opacity: 0; stroke-width: 1; } }
.handle.mention .g-disc { stroke-dasharray: 3 4; }
.handle.missing { opacity: .35; }
.handle-label { display: none; }
.stage { position: relative; margin: 7px 0 0; min-height: 0; overflow: hidden;
  background: radial-gradient(circle at 1px 1px, #8fdcf518 1px, transparent 1.2px) 19px 26px / 24px 24px; }
canvas { width: 100%; height: 100%; display: block; }
.stage-caption { position: absolute; top: 10px; left: 22px; color: var(--muted); font: 8px var(--mono); letter-spacing: 1.5px; pointer-events: none; }
.stage-hint { position: absolute; bottom: 35px; width: 100%; text-align: center; color: var(--muted); font-size: 8px; letter-spacing: 1px; pointer-events: none; }
.legend { display: flex; align-items: center; gap: 12px; position: absolute; bottom: 9px; left: 22px; right: 22px; color: var(--muted); font-size: 9px; }
.legend span { display: flex; align-items: center; gap: 4px; }
.legend i { width: 4px; height: 4px; border-radius: 50%; background: var(--dot); }
.archive-toggle { margin-left: auto; padding: 3px 5px; border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: 9px; border-radius: 0; white-space: nowrap; }
.archive-toggle[aria-pressed="false"] { opacity: .5; }
/* 3D 神經網路：.nodes 不建立堆疊脈絡，標籤的 z-index（0–100，依深度）直接和中央神經元那層（50）比前後
   記憶本體畫在畫布上；這裡的按鈕只是胞體上的點擊區＋下方的名字標籤（2026-11-12） */
.nodes { position: absolute; inset: 0; pointer-events: none; }
canvas.core { position: absolute; inset: 0; z-index: 50; pointer-events: none; }
.node { position: absolute; left: 0; top: 0; pointer-events: auto; max-width: 150px; padding: 14px 4px 2px; border: 0; background: none; text-align: center;
  transform-origin: 50% 8px; border-radius: 0; will-change: transform, opacity; }
.node-label { display: inline-block; max-width: 140px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 10.5px; letter-spacing: .2px; padding: 1px 6px;
  border: 1px solid transparent; color: color-mix(in srgb, var(--node-color) 50%, #e6f3f7); text-shadow: 0 0 4px #000, 0 0 2px #000; transition: opacity .25s, background .2s, border-color .2s; }
.node-meta { display: none; }
.node.lbl-off .node-label { opacity: 0; }
.node.more { padding: 0; }
.node.more .node-label { border-color: var(--line); background: #06121acc; color: var(--muted); text-shadow: none; }
/* 事件顏色由 JS 設在 --ev（讀取綠、新增藍、修改金黃、刪除紅）：被讀寫或滑過時，名字變成名牌 */
.node:hover .node-label, .node:focus-visible .node-label, .node.reading .node-label, .node.writing .node-label { opacity: 1; background: #06121ae6; border-color: var(--ev, var(--node-color)); color: #eaf7fb; text-shadow: none; }
.node:hover, .node:focus-visible { z-index: 300 !important; opacity: 1 !important; outline: none; }
.node.reading, .node.writing { opacity: 1 !important; }
.node.mention .node-label { border-style: dashed; }
.node.born .node-label { animation: born 2.4s ease-out; }
@keyframes born { 0%, 45% { opacity: 0; } 100% { opacity: 1; } }
/* Sleep 掃描標記：⚠ 又熱又可疑（常駐）；路徑／複查、冷只在睡眠期間顯示 */
.node-mark { display: none; position: absolute; top: 0; left: 50%; margin-left: 7px; font: 7px var(--mono); line-height: 1.3; padding: 0 3px; border: 1px solid currentColor; background: #060b10; pointer-events: none; }
.node.m-warn .node-mark, .node.m-path .node-mark, .node.m-cold .node-mark { display: block; }
.node.m-warn .node-label { border-color: #ff6a4dbb; }
.node.m-warn .node-mark { color: #ff6a4d; animation: warn 1.6s ease-in-out infinite; }
.node.m-path .node-mark { color: var(--accent); }
.node.m-cold { filter: saturate(.3) brightness(.75); }
.node.m-cold .node-mark { color: #7d8a8f; border-style: dashed; }
@keyframes warn { 50% { opacity: .45; } }
.node.flash .node-label { opacity: 1; color: #fff; }
.node.burning .node-label { opacity: 0; }
/* 睡眠：整張圖變暗，門縫那層升到暗幕之上，成為唯一的光 */
/* 沒有記憶時的說明（別人第一次裝、還沒用過自動記憶時不會是一片空白） */
.empty-state { position: absolute; left: 50%; top: 68%; transform: translateX(-50%); background: #060b10d9; padding: 6px 10px; width: min(420px, 84%); z-index: 60; text-align: center; pointer-events: none; color: var(--muted); font-size: 10.5px; line-height: 1.65; }
.empty-state strong { display: block; margin-bottom: 4px; color: var(--text); font-size: 11.5px; font-weight: 600; letter-spacing: .5px; }
.empty-state p { margin: 0; }
.empty-state p.zh { margin-top: 6px; opacity: .8; }
.empty-state code { font: 9.5px var(--mono); color: var(--accent); }
.sleep-dim { position: absolute; inset: 0; z-index: 110; background: #020507; opacity: 0; pointer-events: none; transition: opacity 1.6s ease; }
.stage[data-sleep="sleep"] .sleep-dim, .stage[data-sleep="scan"] .sleep-dim, .stage[data-sleep="propose"] .sleep-dim { opacity: .34; }   /* 2026-11-13：整體壓暗一些就好，活化／未活化的明暗差要看得出來 */
.stage[data-sleep="apply"] .sleep-dim, .stage[data-sleep="purge"] .sleep-dim { opacity: .4; }
.stage[data-sleep] canvas.core { z-index: 115; }
.sleep-phase { position: absolute; top: 10px; right: 22px; z-index: 140; font: 8px var(--mono); letter-spacing: 2px; color: var(--accent); opacity: 0; transition: opacity .4s; pointer-events: none; }
.stage[data-sleep] .sleep-phase { opacity: 1; }
.sleep-delta { position: absolute; left: 50%; transform: translate(-50%, -50%); z-index: 150; text-align: center; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .6s; }
.sleep-delta.on { opacity: 1; }
.sleep-delta small { display: block; font: 7.5px var(--mono); letter-spacing: 2px; color: var(--muted); }
.sleep-delta b { font: 13px var(--mono); font-weight: 400; color: #eafaff; text-shadow: 0 0 10px var(--accent); }
.sleep-delta em { font-style: normal; font: 9px var(--mono); color: #9cd3a0; margin-left: 6px; }
@keyframes write-light { 50% { transform: rotate(90deg) scale(1.8); } }
.hud-center { display:none !important; position:absolute; top:60%; left:50%; transform:translateX(-50%); z-index:49; display:flex; align-items:baseline; gap:5px; white-space:nowrap; pointer-events:none; }
.hud-center small { font:7px var(--mono); color:var(--muted); letter-spacing:2px; }
.hud-center strong { font:11px var(--mono); color:var(--accent); font-weight:400; }
.hud-center span { font:7px var(--mono); color:var(--accent); letter-spacing:2px; opacity:.7; }
.timeline { margin: 0 21px; padding: 12px 0 0; border-top: 1px dashed var(--line); overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
.stream-label { display: flex; gap: 6px; align-items: center; }
.live-dot { width: 4px; height: 4px; background: var(--accent); border-radius: 50%; animation: idle 2s ease-in-out infinite; }
.sim-badge { font-size: 8px; color: var(--muted); border: 1px solid var(--line); padding: 2px 5px; letter-spacing: .5px; }
.events { list-style: none; padding: 5px 0 4px; margin: 0; overflow-y: auto; flex: 1; min-height: 0; scrollbar-width: none; }
.events::-webkit-scrollbar { display: none; }
.event { display: grid; grid-template-columns: 47px 34px minmax(0,1fr); gap: 7px; align-items: center; margin: 0; padding: 3px 0; font-size: 10px; }
.event time { color: var(--muted); font: 8px var(--mono); }
.event-tag { font: 8px var(--mono); color: var(--accent); }
.event .event-tag { color: var(--ev, var(--accent)); }
.event.sleep .event-tag { color: #b9b3ff; }
.event.mention .event-tag, .event.boot .event-tag { color: var(--muted); }
.event.old { opacity: .5; }
.event.fresh { animation: fresh 2.4s ease-out; }
@keyframes fresh { from { background: #8fdcf533; } to { background: transparent; } }
.event button { padding: 0; border: 0; background: transparent; text-align: left; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; font-size: 10px; color: var(--text); }
.event .sub { color: var(--muted); font: 8px var(--mono); margin-left: 5px; }
.empty { color: var(--muted); font-size: 9px; padding: 8px 0; }
.footer { margin: 0 21px; border-top: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; font: 8px var(--mono); color: var(--muted); letter-spacing: .5px; white-space: nowrap; overflow: hidden; }
.footer span:last-child { color: var(--accent); }
.capsule { display: none; align-items: center; gap: 11px; width: 100vw; height: 100vh; padding: 0 8px 0 18px; border: 1px solid #4f9fbd80; border-radius: 40px; background: linear-gradient(135deg,#0f2230,#060b10 60%); cursor: default; }
.capsule strong { font-size: 10px; letter-spacing: 2px; }
.capsule span { flex: 1; min-width: 0; font-size: 9px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.capsule span.live { color: var(--accent); }
.capsule span.live { color: var(--ev, var(--accent)); }
.capsule button { flex: none; width: 34px; height: 34px; border: 0; border-radius: 50%; background: transparent; font-size: 15px; color: var(--accent); }
.capsule button:hover { background: #8fdcf522; }
body.collapsed .window { display: none; }
body.collapsed .capsule { display: flex; }
/* ---------- 閱讀器（HUD Markdown Reader） ---------- */
/* 2026-11-13 用戶定：閱讀器改成舞台左側的側邊面板（非強制），網路往右讓位，點選的連線與子連線效果才看得到 */
/* 2026-11-13 用戶定：閱讀器＝左側抽屜，打開時把標題列以下的內容整個往右推，不疊在畫面上 */
dialog.reader { position: fixed; inset: 47px auto 1px 1px; width: var(--dw, 460px); height: auto; z-index: 300; margin: 0; border-width: 0 1px 0 0 !important; border-radius: 0 0 0 8px !important; animation: drawer-in .22s ease-out; container: reader / inline-size; max-width: none; max-height: none; padding: 0; overflow: hidden;
  color: var(--text); border: 1px solid #4f9fbd80; border-radius: 3px; user-select: text; --tc: var(--accent);
  background: linear-gradient(160deg,#0f2230 0,transparent 34%), #050a0e; font-size: clamp(13.5px, 9px + 1.1vw, 16px); }
@keyframes drawer-in { from { transform: translateX(-100%); } }
.window > :not(.topbar) { transition: margin-left .22s ease-out; }
body.drawer .window > :not(.topbar) { margin-left: var(--dw, 460px); }
body.drawer .window > .timeline, body.drawer .window > .footer { margin-left: calc(var(--dw, 460px) + 21px); }
dialog.reader[open] { display: grid; grid-template-rows: auto 2px minmax(0,1fr) 25px; }
dialog.reader::backdrop { background: #03070af5; border-radius: 8px; }
dialog.reader::before, dialog.reader::after { content: ''; position: absolute; width: 13px; height: 13px; pointer-events: none; z-index: 3; }
dialog.reader::before { top: -1px; left: -1px; border-top: 2px solid var(--tc); border-left: 2px solid var(--tc); }
dialog.reader::after { bottom: -1px; right: -1px; border-bottom: 2px solid var(--tc); border-right: 2px solid var(--tc); }
dialog.reader ::selection { background: #8fdcf555; color: #fff; }
.reader-head { padding: 10px 12px 10px 14px; display: flex; align-items: center; gap: 10px; border-bottom: 1px dashed var(--line); cursor: default; user-select: none; }
.reader-mark { flex: none; width: 9px; height: 9px; background: var(--tc); box-shadow: 0 0 12px var(--tc); transform: rotate(45deg); margin: 0 3px; }
.reader-id { min-width: 0; flex: 1; }
.reader-id h2 { font: 12px var(--mono); margin: 0; color: var(--tc); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: .4px; }
.reader-id p { margin: 3px 0 0; font: 9px var(--mono); color: var(--muted); letter-spacing: 1.6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.reader-head .icon-btn { flex: none; width: 28px; height: 26px; font-size: 13px; }
/* 記憶操作：閱讀器標題列按鈕、右鍵選單、確認框 */
.reader-ops { display: flex; gap: 6px; flex: none; }
.op-btn { height: 26px; padding: 0 9px; border: 1px solid var(--line); background: transparent; color: var(--muted); font: 10px var(--mono); letter-spacing: 1px; }
.op-btn:hover { color: var(--text); border-color: var(--accent); }
.op-btn.danger:hover { color: #ff6a74; border-color: #ff4856; }
.ctx-menu { position: fixed; z-index: 1000; min-width: 132px; padding: 4px 0; background: #07121af5; border: 1px solid #4f9fbd80; box-shadow: 0 8px 24px #000a; font-size: 11px; }
.ctx-menu button { display: block; width: 100%; padding: 6px 12px; border: 0; background: transparent; color: var(--text); text-align: left; font: inherit; }
.ctx-menu button:hover, .ctx-menu button:focus-visible { background: #8fdcf51c; outline: none; }
.ctx-menu button.danger { color: #ff8a92; }
.ctx-menu button.danger:hover { background: #ff485622; }
.ctx-menu hr { border: 0; border-top: 1px dashed var(--line); margin: 4px 0; }
.ctx-menu .ctx-title { padding: 4px 12px 6px; color: var(--muted); font: 9px var(--mono); letter-spacing: 1px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
dialog.confirm { width: min(360px, calc(100vw - 40px)); padding: 18px 20px 16px; border: 1px solid #4f9fbd90; background: #060b10; color: var(--text); box-shadow: 0 12px 40px #000c; }
dialog.confirm::backdrop { background: #020507b0; }
dialog.confirm h3 { margin: 0 0 10px; font-size: 14px; letter-spacing: 1px; }
.confirm-file { margin: 0 0 10px; padding: 6px 8px; border-left: 2px solid var(--accent); background: #8fdcf512; font: 11px var(--mono); word-break: break-all; }
dialog.confirm.danger .confirm-file { border-left-color: #ff4856; background: #ff485614; }
.confirm-body { margin: 0 0 16px; color: var(--muted); font-size: 11.5px; line-height: 1.6; }
.confirm-actions { display: flex; justify-content: flex-end; gap: 8px; }
.confirm-actions button { padding: 6px 14px; border: 1px solid var(--line); background: transparent; color: var(--text); font-size: 12px; }
.confirm-actions .confirm-ok { border-color: var(--accent); color: var(--accent); }
.confirm-actions .confirm-ok.danger { border-color: #ff4856; background: #ff485622; color: #ffb3b9; }
.reader-progress { background: #8fdcf512; }
.reader-progress i { display: block; height: 100%; width: 0; background: var(--tc); box-shadow: 0 0 8px var(--tc); }
.reader-scroll { overflow-y: auto; overflow-x: hidden; padding: 18px 18px 30px; outline: none; scroll-padding-top: 12px; }
.reader-scroll > * { max-width: 740px; margin-left: auto; margin-right: auto; }
.reader-scroll::-webkit-scrollbar, .md pre::-webkit-scrollbar, .tablewrap::-webkit-scrollbar { width: 9px; height: 9px; }
.reader-scroll::-webkit-scrollbar-track { background: repeating-linear-gradient(0deg,#8fdcf520 0 1px,transparent 1px 7px); border-left: 1px solid var(--line); }
.md pre::-webkit-scrollbar-track, .tablewrap::-webkit-scrollbar-track { background: #8fdcf50d; }
.reader-scroll::-webkit-scrollbar-thumb, .md pre::-webkit-scrollbar-thumb, .tablewrap::-webkit-scrollbar-thumb { background: #8fdcf5a8; border: 2px solid transparent; background-clip: padding-box; }
.reader-scroll::-webkit-scrollbar-thumb:hover, .md pre::-webkit-scrollbar-thumb:hover, .tablewrap::-webkit-scrollbar-thumb:hover { background: var(--accent); background-clip: padding-box; }
.reader-scroll::-webkit-scrollbar-corner, .md pre::-webkit-scrollbar-corner { background: transparent; }
.reader-foot { padding: 0 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-top: 1px solid var(--line); font: 9px var(--mono); letter-spacing: .8px; color: var(--muted); white-space: nowrap; user-select: none; }
.reader-foot span { overflow: hidden; text-overflow: ellipsis; }
.reader-foot span:last-child { flex: none; color: var(--accent); max-width: 60%; }
.reader-foot span.flash { color: var(--feedback); }

/* 資訊面板（frontmatter） */
.info { position: relative; margin-bottom: 22px; padding: 14px 16px 13px; border: 1px solid var(--line); border-left: 2px solid var(--tc);
  background: linear-gradient(90deg, color-mix(in srgb, var(--tc) 10%, transparent), transparent 72%), var(--panel);
  clip-path: polygon(0 0,calc(100% - 11px) 0,100% 11px,100% 100%,0 100%); }
.info-tags { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; font: 10px var(--mono); letter-spacing: 1.4px; }
.tag { padding: 3px 8px; color: var(--tc); border: 1px solid color-mix(in srgb, var(--tc) 55%, transparent); background: color-mix(in srgb, var(--tc) 13%, transparent); white-space: nowrap; }
.tag.dim { --tc: var(--muted); }
.info-serial { margin-left: auto; padding-right: 8px; color: var(--muted); }
.info h1 { margin: 11px 0 0; font-size: 1.5em; line-height: 1.35; letter-spacing: 1px; font-weight: 650; overflow-wrap: anywhere; }
.info-desc { margin: 6px 0 0; font-size: .95em; line-height: 1.75; color: #cfd0bd; overflow-wrap: anywhere; }
.info dl { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 5px 14px; margin: 13px 0 0; padding-top: 11px; border-top: 1px dashed var(--line); font: 11px/1.5 var(--mono), "Microsoft JhengHei"; }
.info dt { color: var(--muted); letter-spacing: 1.2px; white-space: nowrap; }
.info dd { margin: 0; overflow-wrap: anywhere; color: #d9dac8; }
.info dd small { color: var(--muted); font-size: 1em; }

/* Markdown 內文 */
.md { line-height: 1.9; letter-spacing: .25px; overflow-wrap: anywhere; counter-reset: sec; }
.md > :first-child { margin-top: 0; }
.md p { margin: .85em 0; }
.md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { line-height: 1.45; font-weight: 650; letter-spacing: .6px; }
.md h1 { margin: 1.5em 0 .7em; padding-bottom: .4em; font-size: 1.42em; color: var(--accent); border-bottom: 1px solid var(--line); }
.md h2 { margin: 1.7em 0 .6em; padding-bottom: .35em; font-size: 1.2em; border-bottom: 1px dashed var(--line); counter-increment: sec; }
.md h2::before { content: counter(sec, decimal-leading-zero) ' /'; margin-right: .7em; font: .68em var(--mono); letter-spacing: 1px; color: var(--tc); vertical-align: .12em; }
.md h3 { margin: 1.4em 0 .4em; padding-left: .7em; font-size: 1.06em; border-left: 2px solid var(--tc); }
.md h4, .md h5, .md h6 { margin: 1.2em 0 .3em; font-size: .95em; color: var(--accent); }
.md strong { font-weight: 650; color: #fbe2ac; }
.md em { font-style: italic; color: #d6e6dc; }
.md del { color: var(--muted); }
.md code { font: .88em var(--mono), "Microsoft JhengHei"; padding: 1px 5px; color: #f1dcae; background: #8fdcf514; border: 1px solid #8fdcf526; border-radius: 2px; }
.md .path, .info .path { cursor: copy; border: 1px dashed #9cc8c055; background: #9cc8c012; color: #bfe0d8; border-radius: 2px; }
.md span.path { font: .88em var(--mono), "Microsoft JhengHei"; padding: 1px 5px; }
.info .path { padding: 0 4px; }
.md .path:hover, .info .path:hover { border-color: var(--feedback); background: #9cc8c026; }
.codeblock { margin: 1em 0; border: 1px solid var(--line); border-left: 2px solid var(--accent); background: #0e100f; }
.cb-head { display: flex; align-items: center; justify-content: space-between; padding: 3px 6px 3px 11px; border-bottom: 1px dashed var(--line); font: 9px var(--mono); letter-spacing: 1.5px; color: var(--muted); user-select: none; }
.cb-copy { padding: 2px 7px; border: 1px solid var(--line); border-radius: 0; background: transparent; color: var(--muted); font: 9px var(--mono); letter-spacing: 1px; }
.cb-copy:hover { color: var(--accent); border-color: var(--accent); }
.md pre { margin: 0; padding: 11px 13px; overflow-x: auto; line-height: 1.65; white-space: pre; }
.md pre code { padding: 0; border: 0; background: none; color: #dfe0cc; font-size: .86em; }
.md blockquote { margin: 1em 0; padding: 4px 14px; border-left: 2px solid var(--feedback); background: #9cc8c00f; color: #cbd3c6; }
.md blockquote p { margin: .5em 0; }
.md ul, .md ol { margin: .6em 0; padding-left: 1.45em; list-style: none; }
.md li { position: relative; margin: .28em 0; }
.md li > ul, .md li > ol { margin: .2em 0; }
.md li > p { margin: .5em 0; }
.md ul > li::before { content: ''; position: absolute; left: -1.08em; top: .78em; width: 5px; height: 5px; background: var(--tc); transform: rotate(45deg); }
.md ul ul > li::before { background: transparent; border: 1px solid var(--tc); }
.md ul ul ul > li::before { width: 3px; height: 3px; top: .85em; background: var(--muted); border: 0; }
.md ol { counter-reset: li; padding-left: 2.1em; }
.md ol > li { counter-increment: li; }
.md ol > li::before { content: counter(li, decimal-leading-zero); position: absolute; left: -2.5em; top: .3em; width: 2em; height: auto; text-align: right; font: .76em var(--mono); color: var(--tc); background: none; border: 0; transform: none; }
.md li.task::before { display: none; }
.md .box { display: inline-block; width: .9em; height: .9em; margin: 0 .5em 0 -1.35em; border: 1px solid var(--tc); vertical-align: -.08em; position: relative; }
.md .box.on::after { content: ''; position: absolute; inset: 2px; background: var(--tc); }
.md hr { height: 9px; margin: 1.8em 0; border: 0; background: linear-gradient(var(--line),var(--line)) 0 50% / 100% 1px no-repeat; position: relative; }
.md hr::after { content: ''; position: absolute; left: 50%; top: 1px; width: 7px; height: 7px; margin-left: -4px; background: #050a0e; border: 1px solid var(--accent); transform: rotate(45deg); }
.tablewrap { margin: 1em 0; overflow-x: auto; border: 1px solid var(--line); }
.md table { width: 100%; border-collapse: collapse; font-size: .92em; line-height: 1.6; }
.md th { padding: 7px 11px; text-align: left; font-weight: 650; color: var(--accent); background: #8fdcf514; border-bottom: 1px solid #8fdcf555; white-space: nowrap; }
.md td { padding: 7px 11px; vertical-align: top; border-top: 1px dashed var(--line); }
.md th + th, .md td + td { border-left: 1px solid #d8b86b1c; }
.md tbody tr:hover td { background: #8fdcf50a; }
.md a { color: inherit; text-decoration: none; cursor: pointer; }
.md .wl { --lc: var(--accent); padding: 0 5px 1px 4px; color: var(--lc); border-bottom: 1px solid color-mix(in srgb, var(--lc) 60%, transparent); background: color-mix(in srgb, var(--lc) 10%, transparent); }
.md .wl::before { content: '◆'; margin-right: 4px; font-size: .55em; vertical-align: .25em; }
.md .wl:hover, .md .wl:focus-visible { background: color-mix(in srgb, var(--lc) 26%, transparent); outline: none; }
.md .wl.broken { --lc: var(--muted); border-bottom-style: dashed; background: none; cursor: not-allowed; }
.md .wl.broken::before { content: '◇'; }
.md .wl.broken::after { content: '斷連'; display: inline-block; margin-left: 5px; padding: 0 3px; font: .68em/1.5 var(--mono), "Microsoft JhengHei"; letter-spacing: 1px; border: 1px dashed #92948277; vertical-align: .15em; }
.md .ext { color: var(--reference); border-bottom: 1px dotted #9fb5dd88; cursor: copy; }
.md .ext:hover { background: #9fb5dd1c; }
.md .img-chip { padding: 0 6px; font: .82em var(--mono), "Microsoft JhengHei"; color: var(--muted); border: 1px dashed var(--line); }
.reader-links { margin-top: 30px; padding-top: 13px; border-top: 1px dashed var(--line); display: grid; gap: 11px; }
.link-group b { display: block; margin-bottom: 7px; font: 9px var(--mono); letter-spacing: 1.6px; color: var(--muted); font-weight: 400; }
.link-group div { display: flex; flex-wrap: wrap; gap: 6px; }
.link-chip { --lc: var(--accent); padding: 5px 9px; font-size: 11.5px; color: var(--text); border: 1px solid var(--line); border-left: 2px solid var(--lc); border-radius: 0; background: var(--panel); text-align: left; overflow-wrap: anywhere; }
button.link-chip:hover { border-color: var(--lc); background: color-mix(in srgb, var(--lc) 14%, transparent); }
span.link-chip { --lc: var(--muted); color: var(--muted); border-style: dashed; }
.link-chip .lc-title { display: block; }
.link-chip .lc-type { display: block; margin-top: 3px; font: 8.5px var(--mono); letter-spacing: 1.4px; color: var(--lc); opacity: .85; }
.link-chip .lc-desc { display: none; }
/* 閱讀器夠寬：引用卡改成主文右側的固定欄（捲動時黏住）；依面板寬度判斷，左側面板裡是單欄滿版 */
@container reader (min-width: 720px) {
  .reader-scroll { display: grid; grid-template-columns: minmax(0, 740px) clamp(170px, 24vw, 240px); grid-template-rows: auto auto auto 1fr; justify-content: center; column-gap: 24px; align-content: start; }
  .reader-scroll > * { grid-column: 1; max-width: none; margin-left: 0; margin-right: 0; min-width: 0; }
  .reader-scroll > .reader-links { grid-column: 2; grid-row: 1 / 5; align-self: start; position: sticky; top: 0;
    margin: 0; padding: 2px 0 0 14px; border-top: 0; border-left: 1px dashed var(--line); gap: 16px; }
  .reader-links .link-group div { flex-direction: column; flex-wrap: nowrap; }
  .reader-links .link-chip { width: 100%; padding: 8px 10px; clip-path: polygon(0 0,calc(100% - 7px) 0,100% 7px,100% 100%,0 100%); }
  .reader-links .link-chip .lc-desc { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; margin-top: 5px; font-size: 10.5px; line-height: 1.55; color: var(--muted); }
}
.more-list { display: grid; gap: 7px; }
.more-list button { text-align: left; padding: 10px 12px; border: 1px solid var(--line); border-left: 2px solid var(--node-color); border-radius: 0; background: var(--panel); font-size: 13px; }
.more-list button small { display: block; margin-top: 3px; font: 10px var(--mono); color: var(--muted); }
.more-list button:hover { border-color: var(--node-color); }
.reader-empty { color: var(--muted); font-size: 12px; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { *, *:before, *:after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="window" aria-label="認知核心記憶檢視器">
  <header class="topbar" data-drag>
    <div class="brand"><i class="brand-mark" aria-hidden="true"></i>NOEMA <span style="opacity:.45;font-weight:400">/ NEURAL / 04</span></div>
    <div class="window-controls">
      <button class="icon-btn" id="pin" title="置頂" aria-pressed="true">▲</button>
      <button class="icon-btn" id="collapse" title="縮成膠囊">−</button>
      <button class="icon-btn" id="hide" title="隱藏到系統匣">×</button>
    </div>
  </header>
  <section class="hero" data-drag>
    <div class="eyebrow">PROJECT / <select id="project" title="切換專案"></select></div>
    <h1 data-drag>認知核心</h1>
    <div class="hero-count"><strong>00</strong><span>ACTIVE MEMORIES</span><button class="archive-toggle" aria-pressed="true" title="顯示或隱藏封存記憶">封存 00</button></div>
  </section>
  <section class="stage" aria-label="依類型分色的記憶節點與連結">
    <canvas aria-hidden="true"></canvas>
    <canvas class="core" aria-hidden="true"></canvas>
    <div class="stage-caption">NEURAL ARRAY / ONLINE</div>
    <div class="nodes"></div>
    <div class="hud-center"><small>CORE · CLAUDE</small><strong>00</strong><span>MEMORIES</span></div>
    <button class="handle" data-open="@claude" data-side="-1" title="CLAUDE.md · 啟動注入（醒來時，已經記得）" aria-label="CLAUDE.md，啟動注入"></button>
    <button class="handle" data-open="memory.md" data-side="1" title="MEMORY.md · 啟動注入（醒來時，已經記得）" aria-label="MEMORY.md，啟動注入"></button>
    <div class="handle-label" data-for="@claude">CLAUDE.md</div>
    <div class="handle-label" data-for="memory.md">MEMORY.md</div>
    <div class="empty-state" hidden><strong></strong><p></p><p class="zh"></p></div>
    <div class="sleep-dim" aria-hidden="true"></div>
    <div class="sleep-phase" aria-live="polite"></div>
    <div class="sleep-delta" aria-live="polite"><small>BOOT INJECTION</small><b></b><em></em></div>
    <div class="stage-hint">拖曳旋轉 · 滾輪縮放 · 雙擊回原大小 · 點神經元展開記憶</div>
    <div class="legend" aria-label="記憶類型圖例">
      <span><i style="--dot:var(--project)"></i>project</span>
      <span><i style="--dot:var(--feedback)"></i>feedback</span>
      <span><i style="--dot:var(--user)"></i>user</span>
      <span><i style="--dot:var(--reference)"></i>ref.</span>
    </div>
  </section>
  <section class="timeline" aria-label="讀寫事件時間軸">
    <div class="section-label"><span class="stream-label"><i class="live-dot"></i>01 / ACTIVITY STREAM</span><span class="sim-badge" id="stream-state">連線中</span></div>
    <ol class="events"></ol>
  </section>
  <footer class="footer"><span id="footer-left">—</span><span id="footer-status">LOCAL · 右鍵神經元可封存／刪除</span></footer>
</main>
<div class="capsule" data-drag aria-label="Noema 膠囊">
  <i class="brand-mark"></i><strong data-drag>NOEMA</strong><span id="capsule-status" data-drag>待命</span><button id="expand" title="展開">↗</button>
</div>
<dialog class="reader" aria-labelledby="reader-title">
  <header class="reader-head" data-drag>
    <button class="icon-btn" id="reader-back" title="返回上一筆（Alt+←）" aria-label="返回" hidden>←</button>
    <i class="reader-mark" aria-hidden="true"></i>
    <div class="reader-id"><h2 id="reader-title"></h2><p id="reader-crumb"></p></div>
    <span class="reader-ops" id="reader-ops"></span>
    <button class="icon-btn" id="close-reader" title="關閉（Esc）" aria-label="關閉">×</button>
  </header>
  <div class="reader-progress" aria-hidden="true"><i></i></div>
  <div class="reader-scroll" tabindex="0">
    <section class="info" hidden></section>
    <article class="md" hidden></article>
    <div class="more-list" hidden></div>

</dialog>
<dialog class="confirm" aria-labelledby="confirm-title">
  <h3 id="confirm-title"></h3>
  <p class="confirm-file"></p>
  <p class="confirm-body"></p>

</dialog>
<div class="ctx-menu" role="menu" hidden></div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const send = msg => { try { window.ipc.postMessage(JSON.stringify(msg)); } catch (e) {} };
const TYPE_LABELS = { project: '專案', feedback: '回饋', user: '使用者', reference: '參考', boot: '啟動' };
const colors = { project: '#8fdcf5', feedback: '#86ecc4', user: '#c9b6f6', reference: '#f2c98a' };
const WRITE = '#ff895b';
const pad = n => String(n).padStart(2, '0');

let SNAP = null, files = [], memories = [], shown = [], edges = [], wikiEdges = [];
let width = 420, height = 210, nodeScale = 1, archiveVisible = true, collapsed = false;
let elapsed = 0, lastFrame = 0, lastPaint = 0;
let active = [];            // 正在點亮的事件 {key, kind, start}
let lastLive = 0;
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const stage = $('.stage'), canvas = $('canvas'), ctx = canvas.getContext('2d'), dialog = $('dialog');
const coreCanvas = $('canvas.core'), cctx = coreCanvas.getContext('2d');

/* ---------- 資料 ---------- */
function metadata(content) {
  const fm = (content.match(/^---\r?\n([\s\S]*?)\r?\n---/) || [, ''])[1];
  const field = key => fm.match(new RegExp('^\\s*' + key + ':\\s*(.+)$', 'm'))?.[1]?.trim().replace(/^["']|["']$/g, '');
  const type = field('type');
  return { name: field('name'), description: field('description'), type: colors[type] ? type : 'reference' };
}
const normalize = name => name.replace(/\.md$/i, '').replace(/_/g, '-').toLowerCase();
function resolveLink(target, source) {
  const clean = target.split('|')[0].split('#')[0].trim();
  const basename = clean.split('/').pop();
  const pool = source?.archived || clean.startsWith('archive/') ? files.filter(f => f.archived) : files.filter(f => !f.archived);
  return pool.find(f => normalize(f.file) === normalize(basename)) || pool.find(f => f.name && normalize(f.name) === normalize(clean));
}
function linksOf(file) {
  const links = [];
  for (const m of file.content.matchAll(/\[\[([^\]]+)\]\]/g)) links.push({ text: m[1], target: resolveLink(m[1], file), kind: 'wiki' });
  for (const m of file.content.matchAll(/\[[^\]]+\]\(([^)]+\.md)\)/g)) links.push({ text: m[1], target: resolveLink(m[1], file), kind: 'index' });
  return links;
}
const byKey = key => files.find(f => f.key === key);
const projectLabel = id => id.replace(/^([A-Za-z])--/, '').replace(/^claude-workspace-/, '') || id;

function applySnapshot(s) {
  SNAP = s;
  const titles = {};
  const index = s.boot.memoryIndex;
  if (index) for (const m of index.content.matchAll(/\[([^\]]+)\]\(([^)]+\.md)\)/g)) titles[m[2].split('/').pop().toLowerCase()] = m[1].trim();
  const mk = (f, archived) => {
    const meta = metadata(f.content);
    return { ...f, ...meta, archived, key: (archived ? 'archive/' : '') + f.file.toLowerCase(),
      label: (!archived && titles[f.file.toLowerCase()]) || (archived ? f.file.replace(/\.md$/i, '') : meta.name || f.file.replace(/\.md$/i, '')) };
  };
  const sameProject = !prevProject || prevProject === s.current;
  if (!sameProject) resetSleep();                                    // 換專案：清掉上一個專案的睡眠／銷毀／光束
  const old = sameProject ? new Map(files.map(f => [f.key, f])) : new Map();
  files = [];
  if (s.boot.claudeMd) files.push({ ...s.boot.claudeMd, key: '@claude', type: 'boot', label: 'CLAUDE.md' });
  if (index) files.push({ ...index, key: 'memory.md', type: 'boot', label: 'MEMORY.md' });
  files.push(...s.memories.map(f => mk(f, false)), ...s.archive.map(f => mk(f, true)));
  // 寫入後約 0.25 秒會重建一次：凸顯程度與掃描進度沿用，卡片才不會縮回去再放大
  for (const f of files) { const o = old.get(f.key); if (o) { f.boost = o.boost; f.swept = o.swept; } }
  memories = files.filter(f => f.type !== 'boot');
  edges = files.flatMap(f => linksOf(f).filter(l => l.target && l.target !== f).map(l => ({ source: f, target: l.target, kind: l.kind })));
  wikiEdges = edges.filter(e => e.kind === 'wiki');

  $('.hero-count strong').textContent = pad(s.memories.length);
  $('.hud-center strong').textContent = pad(s.memories.length);
  $('.archive-toggle').textContent = '封存 ' + pad(s.archive.length);
  // 新出現的記憶（同一專案內）記下時間，buildNodes 讓它從光裡浮現
  const keys = new Set(memories.map(f => f.key));
  if (prevKeys && prevProject === s.current) for (const k of keys) if (!prevKeys.has(k)) bornAt[k] = elapsed;
  prevKeys = keys; prevProject = s.current;
  updateHandles();
  updateEmptyState(s);
  const sel = $('#project');
  if (document.activeElement !== sel) {
    sel.replaceChildren(...s.projects.map(p => { const o = document.createElement('option'); o.value = p.id; o.textContent = projectLabel(p.id); o.title = p.id; return o; }));
    sel.value = s.current;
  }
  updateFooter();
  buildNodes();
  refreshReader();
}
// 沒有任何記憶檔時說明 Noema 在看哪裡，而不是一片空白
function updateEmptyState(s) {
  const box = $('.empty-state');
  const noProject = !s.current, empty = !s.memories.length && !s.archive.length;
  box.hidden = !(noProject || empty);
  $('.stage-hint').hidden = !box.hidden;                             // 沒卡片可轉，旋轉提示先藏起來
  if (box.hidden) return;
  const code = t => { const c = document.createElement('code'); c.textContent = t; return c; };
  const [title, en, zh] = box.children;
  title.textContent = noProject ? 'No Claude Code memory found' : 'No memories in this project yet';
  en.replaceChildren(
    'Noema watches Claude Code’s memory folder, ', code('~/.claude/projects/<project>/memory/'),
    noProject ? '. None exists yet. Once Claude saves a memory in any project, it shows up here.'
              : '. When Claude saves a memory for this project, it will appear here as a card.');
  zh.textContent = noProject
    ? '還沒有找到任何 Claude Code 記憶資料夾。等 Claude 在任一專案存下記憶，就會出現在這裡。'
    : '這個專案還沒有記憶。Claude 存下記憶後，會以卡片出現在這裡。';
  placeEmptyState();
}
// 排在 CORE · CLAUDE 標籤下面；視窗太矮時往上收，整塊留在舞台裡
function placeEmptyState() {
  const box = $('.empty-state');
  if (box.hidden) return;
  box.style.top = Math.max(8, Math.min(cy + coreR * 1.25 + 30, height - box.offsetHeight - 40)) + 'px';
}
function updateFooter() {
  if (!SNAP) return;
  const sid = SNAP.sessionId ? SNAP.sessionId.slice(0, 8) : 'NO SESSION';
  $('#footer-left').textContent = 'SESSION · ' + sid + ' / ' + wikiEdges.length + ' LINK';
  $('#stream-state').textContent = Date.now() - lastLive < 60000 ? '即時 · 活躍' : '即時監看';
}

/* ---------- 3D 神經網路（2026-11-12 用戶定：取代卡片雲與門縫） ----------

    if (trackLoaded(ev)) nDirty = true;
    // 超過一分鐘前的事件（新開的對話紀錄從頭讀、或接續對話帶著舊紀錄）只進紀錄，不演
    const stale = ev.ts && Date.now() - Date.parse(ev.ts) > 60000;
    addTimeline(ev, !stale);
    if (stale) continue;
    lastLive = Date.now();
    const cs = $('#capsule-status');
    cs.textContent = (KIND[ev.kind] || ['', ''])[1] + eventLabel(ev); cs.dataset.last = '剛才 · ' + cs.textContent;
    if (ev.kind === 'sleep') { sleepEvent(ev); continue; }
    const kind = ev.kind === 'boot' ? 'read' : ev.kind;
    const keys = ev.kind === 'boot' ? ['@claude', 'memory.md'] : ev.target === '' ? [] : [targetKey(ev.target)];
    for (const key of keys) { active.push({ key, kind, start: elapsed }); nnEvent(key, kind); }
  }
  refreshLights(); updateFooter(); paint();
}

/* ---------- 視窗操作 ---------- */
function applyState(s) {
  collapsed = s.collapsed;
  document.body.classList.toggle('collapsed', collapsed);
  $('#pin').setAttribute('aria-pressed', String(s.onTop));
  $('#pin').title = s.onTop ? '置頂中（點擊取消）' : '置頂';
  $('#hide').title = '隱藏到系統匣' + (s.hotkey ? '（' + s.hotkey + ' 叫出）' : '');
  if (!collapsed) requestAnimationFrame(resize);
}
$('#pin').addEventListener('click', () => send({ cmd: 'pin', on: $('#pin').getAttribute('aria-pressed') !== 'true' }));
$('#collapse').addEventListener('click', () => send({ cmd: 'collapse', on: true }));
$('#expand').addEventListener('click', () => send({ cmd: 'collapse', on: false }));
$('.capsule').addEventListener('dblclick', () => send({ cmd: 'collapse', on: false }));
$('#hide').addEventListener('click', () => send({ cmd: 'hide' }));
$('#project').addEventListener('change', e => { send({ cmd: 'project', id: e.target.value }); e.target.blur(); });
$('.archive-toggle').addEventListener('click', () => {
  archiveVisible = !archiveVisible;
  $('.archive-toggle').setAttribute('aria-pressed', String(archiveVisible));
  for (const f of shown) if (f.archived) f.button.hidden = !archiveVisible;
  nDirty = true; positionNodes(); paint();
});
const EDGE = 6;
function edgeDir(e) {
  if (collapsed) return '';
  const w = innerWidth, h = innerHeight;
  const v = e.clientY < EDGE ? 'n' : e.clientY > h - EDGE ? 's' : '';
  const hz = e.clientX < EDGE ? 'w' : e.clientX > w - EDGE ? 'e' : '';
  return v + hz;
}
const CURSOR = { n: 'ns-resize', s: 'ns-resize', e: 'ew-resize', w: 'ew-resize', ne: 'nesw-resize', sw: 'nesw-resize', nw: 'nwse-resize', se: 'nwse-resize' };
document.addEventListener('mousemove', e => { document.documentElement.style.cursor = dialog.style.cursor = CURSOR[edgeDir(e)] || ''; });
document.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  const dir = edgeDir(e);
  if (dir) { e.preventDefault(); send({ cmd: 'resize', dir }); return; }
  if (e.target.closest('button, select, .node')) return;
  if (e.target.closest('dialog') && !e.target.closest('.reader-head')) return;   // 閱讀器只有標題列能拖視窗
  if (e.target.closest('[data-drag]')) { if (e.detail > 1) return; e.preventDefault(); send({ cmd: 'drag' }); }
}, true);
document.addEventListener('contextmenu', e => { if (!e.target.closest('dialog')) e.preventDefault(); });

/* ---------- 記憶操作：封存／永久刪除／銷毀（右鍵選單或閱讀器按鈕，一律先確認） ---------- */
const TRASH_NOTE = 'Noema 動手前會先備份一份到 %LOCALAPPDATA%\\Noema\\trash\\。';
const OPS = {
  archive: { label: '封存', title: '封存這條記憶？', danger: false,
    body: '搬進 archive/，MEMORY.md 裡它的那行索引會移到 archive/ARCHIVE.md。之後可以從 archive/ 搬回來。' },
  delete: { label: '永久刪除', title: '永久刪除這條記憶？', danger: true,
    body: '直接刪除這個檔，並拿掉 MEMORY.md 裡它的那行索引。記憶目錄裡無法復原。' + TRASH_NOTE },
  purge: { label: '銷毀', title: '銷毀這條封存記憶？', danger: true,
    body: '從 archive/ 永久刪除，並拿掉 ARCHIVE.md 裡它的那行索引。記憶目錄裡無法復原。' + TRASH_NOTE },
};
const opsFor = f => (!f || f.type === 'boot' || f.more) ? [] : f.archived ? ['purge'] : ['archive', 'delete'];
const confirmDlg = $('dialog.confirm'), ctxMenu = $('.ctx-menu');
let pendingOp = null;
function askOp(op, f) {
  const o = OPS[op];
  pendingOp = { op, key: f.key };
  $('#confirm-title').textContent = o.title;
  confirmDlg.querySelector('.confirm-file').textContent = (f.archived ? 'archive/' : '') + f.file + (f.label && f.label !== f.file.replace(/\.md$/i, '') ? '　·　' + f.label : '');
  confirmDlg.querySelector('.confirm-body').textContent = o.body;
  const ok = confirmDlg.querySelector('.confirm-ok');
  ok.textContent = o.label; ok.classList.toggle('danger', o.danger);
  confirmDlg.classList.toggle('danger', o.danger);
  confirmDlg.showModal();
  confirmDlg.querySelector('.confirm-cancel').focus();               // 預設焦點在「取消」，按 Enter 不會誤刪
}
confirmDlg.querySelector('.confirm-cancel').addEventListener('click', () => { pendingOp = null; confirmDlg.close(); });
confirmDlg.addEventListener('close', () => { pendingOp = null; });
confirmDlg.querySelector('.confirm-ok').addEventListener('click', () => {
  const p = pendingOp; pendingOp = null; confirmDlg.close();
  if (!p) return;
  if (dialog.open && trail.length && trail[trail.length - 1].key === p.key) dialog.close();   // 正在讀的那條被動了：關掉閱讀器
  send({ cmd: 'memop', op: p.op, key: p.key });
});
function hideCtx() { ctxMenu.hidden = true; }
function showCtx(f, x, y) {
  ctxMenu.replaceChildren();
  const title = document.createElement('div'); title.className = 'ctx-title'; title.textContent = (f.archived ? 'archive/' : '') + f.file; ctxMenu.append(title);
  const item = (text, fn, danger) => { const b = document.createElement('button'); b.type = 'button'; b.setAttribute('role', 'menuitem'); b.textContent = text; if (danger) b.className = 'danger'; b.addEventListener('click', () => { hideCtx(); fn(); }); ctxMenu.append(b); };
  item('開啟', () => openReader(f));
  ctxMenu.append(document.createElement('hr'));
  for (const op of opsFor(f)) item(OPS[op].label + '…', () => askOp(op, f), OPS[op].danger);
  ctxMenu.hidden = false;
  const r = ctxMenu.getBoundingClientRect();
  ctxMenu.style.left = Math.min(x, innerWidth - r.width - 6) + 'px';
  ctxMenu.style.top = Math.min(y, innerHeight - r.height - 6) + 'px';
  ctxMenu.querySelector('button').focus();
}
$('.nodes').addEventListener('contextmenu', e => {
  const b = e.target.closest('.node'); if (!b) return;
  const f = shown.find(x => x.button === b);
  if (!opsFor(f).length) return;
  e.preventDefault(); e.stopPropagation();
  showCtx(f, e.clientX, e.clientY);
});
document.addEventListener('pointerdown', e => { if (!ctxMenu.hidden && !e.target.closest('.ctx-menu')) hideCtx(); }, true);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !ctxMenu.hidden) { e.stopPropagation(); hideCtx(); } }, true);
stage.addEventListener('wheel', hideCtx, { passive: true });
// 閱讀器標題列的操作按鈕
function renderReaderOps(f) {
  const box = $('#reader-ops'); box.replaceChildren();
  for (const op of opsFor(f)) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'op-btn' + (OPS[op].danger ? ' danger' : '');
    b.textContent = OPS[op].label; b.title = OPS[op].title;
    b.addEventListener('click', () => askOp(op, f));
    box.append(b);
  }
}
// 操作結果：右下角狀態列顯示幾秒
let opMsgTimer = 0;
function onMemopResult(r) {
  const s = $('#footer-status');
  s.textContent = (r.ok ? '✓ ' : '✕ ') + r.message;
  s.style.color = r.ok ? '' : '#ff8a92';
  clearTimeout(opMsgTimer);
  opMsgTimer = setTimeout(() => { s.textContent = 'LOCAL · 右鍵神經元可封存／刪除'; s.style.color = ''; }, r.ok ? 4000 : 8000);
}

/* ---------- 主迴圈 ---------- */
function frame(ts) {
  try {
    if (!lastFrame) lastFrame = ts;
    const dt = Math.min(ts - lastFrame, 100); lastFrame = ts;
    elapsed += dt;
    if (!document.hidden && ts - lastPaint > 14) {
      lastPaint = ts;
      let expired = false;
      if (active.length && active.some(a => elapsed - a.start >= 4200)) { refreshLights(); expired = true; }
      const moving = spin(ts - lastSpin); lastSpin = ts;
      if (!collapsed && SNAP && (moving || boosting())) positionNodes();
      // expired：減少動態效果模式下，事件結束那一格也要重畫一次，關聯線和門縫顏色才會收掉
      if (!collapsed && (!reducedMotion || active.length || moving || expired || sleepBusy())) paint();
    }
  } catch (e) {
    $('#footer-status').textContent = 'ERR ' + e.message;
  } finally {
    requestAnimationFrame(frame);                                  // 任何一格出錯都不能讓動畫停掉
  }
}
// 藏到系統匣時 elapsed 不走、事件卻照收：藏超過幾秒再回來，就把積下來的光束清掉，不要一次全部爆出來
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  if (hiddenAt && Date.now() - hiddenAt > 4200) { active = []; refreshLights(); paint(); }
  hiddenAt = 0;
});
setInterval(updateFooter, 15000);
window.__noema = msg => {
  try {
    if (msg.type === 'snapshot') applySnapshot(msg);
    else if (msg.type === 'events') onEvents(msg.events, msg.history);
    else if (msg.type === 'state') applyState(msg);
    else if (msg.type === 'sleep-report') onSleepReport(msg.report);
    else if (msg.type === 'memop-result') onMemopResult(msg);
  } catch (e) { $('#footer-status').textContent = 'ERR ' + e.message; }
};
resize();
requestAnimationFrame(frame);
send({ cmd: 'ready' });
</script>
</body>
</html>
